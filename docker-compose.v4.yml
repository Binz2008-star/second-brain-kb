services:
  second-brain-v4:
    build:
      context: .
      dockerfile: Dockerfile.v4
    container_name: second-brain-v4
    env_file: .env
    environment:
      - OLLAMA_EMBED_URL=http://host.docker.internal:11434/api/embed
      - OLLAMA_CHAT_URL=http://host.docker.internal:11434/api/chat
      - ARCHITECT_MODEL=deepseek-r1:14b
      - EDITOR_MODEL=deepseek-r1:14b
      - CHAT_MODEL=deepseek-r1:14b
      - EMBED_MODEL=nomic-embed-text
      - PROJECT_CONTENT_ENGINE=/app/projects/content-engine
      - PROJECT_LVYY=/app/projects/lvyy
      - PROJECT_RICO=/app/projects/rico
    volumes:
      - "${PROJECT_CONTENT_ENGINE_HOST:-./projects/content-engine}:/app/projects/content-engine:ro"
      - "${PROJECT_LVYY_HOST:-./projects/lvyy}:/app/projects/lvyy:ro"
      - "${PROJECT_RICO_HOST:-./projects/rico}:/app/projects/rico:ro"
      - "./memory:/app/memory"
      - "./logs:/app/logs"
      - "./ui:/app/ui:ro"
    ports:
      - "8000:8000"  # API + Web UI
    restart: unless-stopped
    command: python api.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Ollama runs on the host (host.docker.internal) so GPU/VRAM stays local.
  # Add this only if you want Ollama in a container instead:
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   volumes:
  #     - ollama:/root/.ollama
  #   ports:
  #     - "11434:11434"
  #   restart: unless-stopped
  #
  # Neon is cloud-hosted (external), so no Postgres service here.
  # For a local Postgres+pgvector alternative, uncomment:
  #   pgvector:
  #     image: pgvector/pgvector:pg16
  #     environment:
  #       POSTGRES_DB: second_brain
  #       POSTGRES_USER: postgres
  #       POSTGRES_PASSWORD: postgres
  #       POSTGRES_HOST_AUTH_METHOD: trust
  #     ports:
  #       - "5432:5432"
  #     volumes:
  #       - pgdata:/var/lib/postgresql/data

