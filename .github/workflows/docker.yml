name: ROBEN AI Console Docker Build

on:
  push:
    branches: ["main", "test-env", "feat/**"]
  pull_request:
    branches: ["main", "test-env", "feat/**"]
  schedule:
    # Weekly Docker build to keep image up-to-date
    cron: "0 2 * * 0"

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.export_tag.outputs.image_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-dashboard
          file: ./ai-dashboard/Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/second-brain-kb:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/second-brain-kb:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/second-brain-kb:build-cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/second-brain-kb:build-cache,mode=max
          build-args: |
            NEON_DSN=${{ secrets.NEON_DSN }}
            OLLAMA_EMBED_URL=${{ secrets.OLLAMA_EMBED_URL }}
            EMBED_MODEL=${{ secrets.EMBED_MODEL }}

      - name: Export Image Info
        id: export_tag
        if: always()
        run: |
          TAG="${{ secrets.DOCKERHUB_USERNAME }}/second-brain-kb:latest"
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy Docker Image
    needs: build
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-env' || startsWith(github.ref, 'refs/heads/feat/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Display Deployment Info
        run: |
          echo "🚀 Deploying Docker image: ${{ needs.build.outputs.image_tag }}"

      - name: Documentation
        run: |
          echo "✅ Docker CI/CD Pipeline Complete"
          echo "📋 Image: ${{ needs.build.outputs.image_tag }}"
          echo "🌐 Use: docker pull ${{ needs.build.outputs.image_tag }}"
