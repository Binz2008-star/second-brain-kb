name: ROBEN AI Console Docker Build

on:
  push:
    branches: ["main", "test-env", "feat/**"]
  pull_request:
    branches: ["main", "test-env", "feat/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v5
        with:
          context: ./ai-dashboard
          file: ./ai-dashboard/Dockerfile
          push: false
